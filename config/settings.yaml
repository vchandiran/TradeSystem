broker:
  provider: alice_blue
  user_id: "1363055"          # Alice Blue user/client ID
  api_key: "PbDlH3dl4w"          # Alice Blue API key
  # Credentials can be overridden via environment variables:
  #   BROKER_USER_ID, BROKER_API_KEY

trading:
  exchange: NSE
  default_product_type: Intraday   # Intraday | Delivery | CoverOrder | BracketOrder
  default_order_type: Market       # Market | Limit | StopLossLimit | StopLossMarket
  max_positions: 5                 # Maximum concurrent open positions
  max_order_value: 100000          # Maximum value (INR) per single order
  capital_per_trade: 20000         # Capital allocated per trade (INR)

strategy:
  name: Multi_Confirmation        # High-probability 70%+ win rate multi-factor strategy
  min_score_buy: 7                 # Minimum 7/10 confirmations to BUY
  min_score_sell: 7                # Minimum 7/10 confirmations to SELL
  trend_ema_period: 50             # Institutional trend direction
  fast_ema: 9                      # Short-term momentum
  slow_ema: 21                     # Pullback target
  rsi_buy_min: 35.0                # RSI oversold bounce zone
  rsi_buy_max: 58.0                # Avoid buying overbought
  stop_loss_atr_mult: 1.4          # ATR-based volatility stop
  target_atr_mult: 1.8             # Target based on ATR (realistic 1:1.3 R:R)
  breakeven_trigger_pct: 0.45      # Move SL to entry at +0.45% (eliminates losses)
  trailing_stop_pct: 0.75          # Lock in profit trailing stop
  timeframe: 5min                  # 5-minute intraday execution timeframe

risk_management:
  max_loss_per_trade_pct: 2.0      # Max loss per trade as % of capital_per_trade
  max_daily_loss_pct: 5.0          # Max cumulative daily loss as % of total capital
  trailing_stop_pct: 1.5           # Trailing stop-loss distance (%)
  position_size_pct: 2.0           # Position sizing as % of total portfolio
  max_drawdown_pct: 10.0           # Circuit-breaker: halt trading if drawdown exceeds this

